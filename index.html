<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>To Whom It May Only Concern</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="intro" id="introText">
    To whom it may only concern,
  </div>

  <button class="btn" onclick="showLetter()">
    Read it
  </button>

  <div class="letter" id="letterBox">

    <p id="typedText"></p>

    <img
      src="ttd.png"
      alt="Signature"
      class="signature"
    >

  </div>

  <audio id="bgMusic" loop>
  <source src="./music.mp3" type="audio/mpeg">
</audio>

  <script src="./script.js"></script>

</body>

</html>
